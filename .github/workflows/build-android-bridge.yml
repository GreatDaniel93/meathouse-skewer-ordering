name: Build Android Bridge APK

on:
  push:
    branches: [main]
    paths:
      - 'android-bridge/**'
      - '.github/workflows/build-android-bridge.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle -p android-bridge assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MeatHouse-Skewer-Bridge-APK
          path: android-bridge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
