name: Build Cupertino Status v0.13

on:
  push:
    branches: [cupertino-status-build]
    paths:
      - 'tmp/cupertino-v13/**'
      - '.github/workflows/build-cupertino-v13.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Reconstruct v0.13 source
        run: |
          mkdir -p /tmp/cupertino-v13
          base64 -d tmp/cupertino-v13/source.b64 > /tmp/cupertino-v13/source.zip
          unzip -q /tmp/cupertino-v13/source.zip -d /tmp/cupertino-v13/src
      - name: Build release APK
        run: gradle -p /tmp/cupertino-v13/src/CupertinoStatusV13 assembleRelease --stacktrace
      - name: Verify APK
        run: |
          test -s /tmp/cupertino-v13/src/CupertinoStatusV13/app/build/outputs/apk/release/app-release.apk
          unzip -t /tmp/cupertino-v13/src/CupertinoStatusV13/app/build/outputs/apk/release/app-release.apk >/dev/null
          ls -lh /tmp/cupertino-v13/src/CupertinoStatusV13/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Cupertino-Status-Duo-v0.13-APK
          path: /tmp/cupertino-v13/src/CupertinoStatusV13/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
