name: Build Paw Status Family v1.2.2

on:
  push:
    branches: [cupertino-status-build]
    paths:
      - 'tmp/pawstatus-v122/**'
      - '.github/workflows/build-pawstatus-v122.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Reconstruct stable v1.1 base and apply v1.2.2
        run: |
          mkdir -p /tmp/pawstatus
          cat \
            tmp/pawstatus-v11/source.b64 \
            tmp/pawstatus-v11/part01.b64 \
            tmp/pawstatus-v11/part02.b64 \
            tmp/pawstatus-v11/part03.b64 \
            tmp/pawstatus-v11/part04.b64 \
            tmp/pawstatus-v11/part05.b64 \
            tmp/pawstatus-v11/part06.b64 \
            > /tmp/pawstatus/source.zip.b64
          test "$(wc -c < /tmp/pawstatus/source.zip.b64)" -eq 62412
          base64 -d /tmp/pawstatus/source.zip.b64 > /tmp/pawstatus/source.zip
          unzip -t /tmp/pawstatus/source.zip >/dev/null
          unzip -q /tmp/pawstatus/source.zip -d /tmp/pawstatus/src
          PROJECT=/tmp/pawstatus/src/PawStatusV1
          cp tmp/pawstatus-v122/StatusOverlayView.kt "$PROJECT/app/src/main/java/com/daniel/cupertinoStatus/StatusOverlayView.kt"
          cp tmp/pawstatus-v122/OverlayService.kt "$PROJECT/app/src/main/java/com/daniel/cupertinoStatus/OverlayService.kt"
          cp tmp/pawstatus-v12/family_cluster.webp "$PROJECT/app/src/main/res/drawable-nodpi/family_cluster.webp"
          sed -i -E 's/versionCode = [0-9]+/versionCode = 122/' "$PROJECT/app/build.gradle.kts"
          sed -i -E 's/versionName = "[^"]+"/versionName = "1.2.2"/' "$PROJECT/app/build.gradle.kts"
          sed -i 's/Paw Status · Family Edition v1.1/Paw Status · Family Edition v1.2.2/g' "$PROJECT/app/src/main/java/com/daniel/cupertinoStatus/MainActivity.kt"
          sed -i 's/圆环显示电量，四只狗爪显示手机信号强度。/圆环显示电量，狗爪显示手机信号；四只头像按 Wi-Fi 强度 1-4 档依次亮起。/g' "$PROJECT/app/src/main/java/com/daniel/cupertinoStatus/MainActivity.kt" || true
      - name: Build release APK
        run: gradle -p /tmp/pawstatus/src/PawStatusV1 assembleRelease --stacktrace
      - name: Verify APK
        run: |
          APK=/tmp/pawstatus/src/PawStatusV1/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          ls -lh "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: Paw-Status-Family-v1.2.2-APK
          path: /tmp/pawstatus/src/PawStatusV1/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
