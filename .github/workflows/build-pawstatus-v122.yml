name: Build Paw Status Family v1.5

on:
  push:
    branches: [cupertino-status-build]
    paths:
      - 'tmp/pawstatus-v15/**'
      - 'tmp/pawstatus-v122/OverlayService.kt'
      - '.github/workflows/build-pawstatus-v122.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Reconstruct stable base and apply v1.5 master design
        run: |
          mkdir -p /tmp/pawstatus
          cat \
            tmp/pawstatus-v11/source.b64 \
            tmp/pawstatus-v11/part01.b64 \
            tmp/pawstatus-v11/part02.b64 \
            tmp/pawstatus-v11/part03.b64 \
            tmp/pawstatus-v11/part04.b64 \
            tmp/pawstatus-v11/part05.b64 \
            tmp/pawstatus-v11/part06.b64 \
            > /tmp/pawstatus/source.zip.b64
          test "$(wc -c < /tmp/pawstatus/source.zip.b64)" -eq 62412
          base64 -d /tmp/pawstatus/source.zip.b64 > /tmp/pawstatus/source.zip
          unzip -t /tmp/pawstatus/source.zip >/dev/null
          unzip -q /tmp/pawstatus/source.zip -d /tmp/pawstatus/src
          PROJECT=/tmp/pawstatus/src/PawStatusV1

          cp tmp/pawstatus-v15/StatusOverlayView.kt "$PROJECT/app/src/main/java/com/daniel/cupertinoStatus/StatusOverlayView.kt"
          cp tmp/pawstatus-v122/OverlayService.kt "$PROJECT/app/src/main/java/com/daniel/cupertinoStatus/OverlayService.kt"

          base64 -d tmp/pawstatus-v15/pet_cat_orange.b64 > "$PROJECT/app/src/main/res/drawable-nodpi/pet_cat_orange.webp"
          base64 -d tmp/pawstatus-v15/pet_cat_white.b64 > "$PROJECT/app/src/main/res/drawable-nodpi/pet_cat_white.webp"
          base64 -d tmp/pawstatus-v15/pet_dog_brown_tiny.b64 > "$PROJECT/app/src/main/res/drawable-nodpi/pet_dog_brown.webp"
          base64 -d tmp/pawstatus-v15/pet_dog_black_tiny.b64 > "$PROJECT/app/src/main/res/drawable-nodpi/pet_dog_black.webp"
          test -s "$PROJECT/app/src/main/res/drawable-nodpi/pet_cat_orange.webp"
          test -s "$PROJECT/app/src/main/res/drawable-nodpi/pet_cat_white.webp"
          test -s "$PROJECT/app/src/main/res/drawable-nodpi/pet_dog_brown.webp"
          test -s "$PROJECT/app/src/main/res/drawable-nodpi/pet_dog_black.webp"

          sed -i -E 's/versionCode = [0-9]+/versionCode = 150/' "$PROJECT/app/build.gradle.kts"
          sed -i -E 's/versionName = "[^"]+"/versionName = "1.5"/' "$PROJECT/app/build.gradle.kts"
          sed -i 's/Paw Status · Family Edition v1.1/Paw Status · Family Edition v1.5/g' "$PROJECT/app/src/main/java/com/daniel/cupertinoStatus/MainActivity.kt"
          sed -i 's/不完整圆环显示电量，下面四个狗爪补足圆形并显示手机信号强度。/外圈圆环显示电量；四个爪子显示真实 SIM 手机网络信号；四个独立宠物头像按 Wi-Fi 强度逐档亮起。/g' "$PROJECT/app/src/main/java/com/daniel/cupertinoStatus/MainActivity.kt" || true
          sed -i 's/信号：1–4 个狗爪依次点亮。/SIM 信号：1–4 个爪子按真实手机网络信号依次点亮。/g' "$PROJECT/app/src/main/java/com/daniel/cupertinoStatus/MainActivity.kt" || true
          sed -i 's/中间：固定显示你家的四只小家伙。/中间：四个独立头像按 Wi-Fi 强度逐档亮起。/g' "$PROJECT/app/src/main/java/com/daniel/cupertinoStatus/MainActivity.kt" || true
      - name: Build release APK
        run: gradle -p /tmp/pawstatus/src/PawStatusV1 assembleRelease --stacktrace
      - name: Verify APK
        run: |
          APK=/tmp/pawstatus/src/PawStatusV1/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          ls -lh "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: Paw-Status-Family-v1.5-APK
          path: /tmp/pawstatus/src/PawStatusV1/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
