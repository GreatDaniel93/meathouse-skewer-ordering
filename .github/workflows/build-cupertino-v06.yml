name: Build Cupertino Status v0.6

on:
  push:
    branches: [cupertino-status-build]
    paths:
      - 'tmp/cupertino-v06/**'
      - '.github/workflows/build-cupertino-v06.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Reconstruct v0.5 base and apply v0.6 drawing
        run: |
          mkdir -p /tmp/cupertino
          cat tmp/cupertino-v05/s00.b64 tmp/cupertino-v05/tail00.b64 tmp/cupertino-v05/part01.b64 tmp/cupertino-v05/part02.b64 tmp/cupertino-v05/part03.b64 > /tmp/cupertino/source.zip.b64
          test "$(wc -c < /tmp/cupertino/source.zip.b64)" -eq 26368
          base64 -d /tmp/cupertino/source.zip.b64 > /tmp/cupertino/source.zip
          unzip -q /tmp/cupertino/source.zip -d /tmp/cupertino/src
          PROJECT=/tmp/cupertino/src/CupertinoStatusV05
          cp tmp/cupertino-v06/StatusOverlayView.kt "$PROJECT/app/src/main/java/com/daniel/cupertinoStatus/StatusOverlayView.kt"
          sed -i 's/versionCode = 50/versionCode = 60/' "$PROJECT/app/build.gradle.kts"
          sed -i 's/versionName = "0.5"/versionName = "0.6"/' "$PROJECT/app/build.gradle.kts"
      - name: Build release APK
        run: gradle -p /tmp/cupertino/src/CupertinoStatusV05 assembleRelease --stacktrace
      - name: Verify APK
        run: |
          test -s /tmp/cupertino/src/CupertinoStatusV05/app/build/outputs/apk/release/app-release.apk
          unzip -t /tmp/cupertino/src/CupertinoStatusV05/app/build/outputs/apk/release/app-release.apk >/dev/null
          ls -lh /tmp/cupertino/src/CupertinoStatusV05/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Cupertino-Status-Duo-v0.6-APK
          path: /tmp/cupertino/src/CupertinoStatusV05/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
