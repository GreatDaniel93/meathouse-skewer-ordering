name: Build Cupertino Status v0.5

on:
  push:
    branches: [cupertino-status-build]
    paths:
      - 'tmp/cupertino-v05/**'
      - '.github/workflows/build-cupertino-v05.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Decode source
        run: |
          mkdir -p /tmp/cupertino
          cat tmp/cupertino-v05/s00.b64 tmp/cupertino-v05/tail00.b64 tmp/cupertino-v05/part01.b64 tmp/cupertino-v05/part02.b64 tmp/cupertino-v05/part03.b64 > /tmp/cupertino/source.zip.b64
          test "$(wc -c < /tmp/cupertino/source.zip.b64)" -eq 26368
          base64 -d /tmp/cupertino/source.zip.b64 > /tmp/cupertino/source.zip
          unzip -t /tmp/cupertino/source.zip
          unzip -q /tmp/cupertino/source.zip -d /tmp/cupertino/src
      - name: Build release APK
        run: gradle -p /tmp/cupertino/src/CupertinoStatusV05 assembleRelease --stacktrace
      - name: Verify APK
        run: |
          test -s /tmp/cupertino/src/CupertinoStatusV05/app/build/outputs/apk/release/app-release.apk
          ls -lh /tmp/cupertino/src/CupertinoStatusV05/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Cupertino-Status-Duo-v0.5-APK
          path: /tmp/cupertino/src/CupertinoStatusV05/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
